# DIP (Depth In Pond), the pond water-level sensor: Seeed XIAO ESP32-C6, JSN-SR20 dual-probe ultrasonic (JSN-SR20-Y1), float switch, 18650 battery.
#
# What it does:
#   - Wakes every 20 minutes, takes 5 distance readings, sends the middle one to Home Assistant, sleeps again.
#   - The float switch wakes it IMMEDIATELY when the water drops (D1). While the float stays low it checks
#     every 2 minutes, and it also wakes the moment the float comes back up.
#   - Sends pond water temperature, battery voltage and %, float state and Wi-Fi signal each time.
#   - Turn on "DIP stay awake" in Home Assistant to keep it awake for updates (it checks on each wake).
#
# Pins (see ../docs/guide/d_overview.png):
#   D1 (GPIO1)   float switch to GND, 100k pull-up to 3V3 (wake pin; float must be OPEN when the water is normal)
#   D0 (GPIO0)   battery voltage through a 100k/100k divider from BAT+
#   D4 (GPIO22)  sensor Trig     D5 (GPIO23)  sensor Echo
#   D3 (GPIO21)  DS18B20 water-temperature probe data, 4.7k pull-up to 3V3
#   The cell goes to the XIAO's BAT + / - pads underneath; the XIAO charges it from its USB-C.
#   Only GPIO0-7 can wake a C6 from deep sleep, so the float has to stay on D0-D2.
#
# First flash over USB: plug in, run `esphome run dip.yaml`. If it isn't found, hold B (boot), tap R (reset).
# Copy secrets.example.yaml to secrets.yaml and fill it in (secrets.yaml stays out of git).

substitutions:
  name: dip
  friendly_name: DIP
  normal_sleep: 20min
  normal_sleep_ms: "1200000"     # same as normal_sleep, in milliseconds
  low_water_sleep_ms: "120000"   # 2 minutes while the float is low

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 800          # before Wi-Fi: the XIAO's antenna switch (GPIO3 low = switch on, GPIO14 low = built-in antenna)
      then:
        - lambda: |-
            gpio_reset_pin(GPIO_NUM_3);
            gpio_set_direction(GPIO_NUM_3, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_3, 0);
            gpio_reset_pin(GPIO_NUM_14);
            gpio_set_direction(GPIO_NUM_14, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_14, 0);
    - priority: -100         # after Wi-Fi and the API are up
      then:
        - script.execute: take_reading

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB            # the XIAO has 4 MB (the devkit board this borrows has 8)
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s         # never reboot just because HA isn't connected (it sleeps most of the time)

ota:
  - platform: esphome
    password: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true         # skip the scan: connect straight to the SSID (saves battery)
  power_save_mode: none
  # Pin it to one access point and a static IP so each wake-up connects in about a second.
  # Fill these in from your network, then uncomment:
  # bssid: !secret wifi_bssid
  # manual_ip:
  #   static_ip: !secret static_ip
  #   gateway: !secret gateway
  #   subnet: 255.255.255.0
  #   dns1: !secret dns

deep_sleep:
  id: sleeper
  run_duration: 20s          # safety net: sleep after 20 s even if something hangs
  sleep_duration: ${normal_sleep}
  wakeup_pin:
    number: GPIO1
    inverted: true           # float closes to GND when the water is low
    mode: INPUT              # the 100k pull-up is on the board (internal pull-ups aren't reliable in sleep)
    allow_other_uses: true   # the float binary sensor reads the same pin
  wakeup_pin_mode: INVERT_WAKEUP   # if the float is already low, wake again when it comes back up

script:
  - id: take_reading
    mode: single
    then:
      - wait_until:            # give Home Assistant a moment to send the stay-awake state
          condition:
            api.connected:
          timeout: 10s
      - repeat:
          count: 5
          then:
            - component.update: distance_raw
            - delay: 250ms
      - component.update: battery_voltage
      - component.update: water_temp
      - delay: 800ms           # the probe needs 750 ms to measure
      - delay: 1s            # let the last values reach Home Assistant
      - if:
          condition:
            binary_sensor.is_on: stay_awake
          then:
            - logger.log: "Stay-awake is on: not sleeping"
            - deep_sleep.prevent: sleeper
            - if:                # after a reboot the switch is already on, so on_press never fires: start the loop here
                condition:
                  not:
                    script.is_running: awake_loop
                then:
                  - script.execute: awake_loop
          else:
            - deep_sleep.enter:
                id: sleeper
                sleep_duration: !lambda |-
                  return id(float_low).state ? ${low_water_sleep_ms} : ${normal_sleep_ms};

  # When stay-awake is switched on, keep taking readings every 30 s so you can watch it live
  - id: awake_loop
    mode: restart
    then:
      - while:
          condition:
            binary_sensor.is_on: stay_awake
          then:
            - script.execute: take_reading
            - delay: 30s

one_wire:
  - platform: gpio
    pin: GPIO21

sensor:
  - platform: dallas_temp
    id: water_temp
    name: "Water temperature"
    update_interval: never   # the script reads it on each wake
    accuracy_decimals: 1

  - platform: ultrasonic
    id: distance_raw
    name: "Distance to water"
    trigger_pin: GPIO22
    echo_pin: GPIO23
    pulse_time: 25us         # the JSN-SR20 wants at least 20 us; lengthen if readings come back empty
    timeout: 3m
    update_interval: never   # the script triggers the readings
    unit_of_measurement: "cm"
    device_class: distance   # lets HA show it in inches
    state_class: measurement # keeps long-term history for the month chart
    accuracy_decimals: 1
    filters:
      - multiply: 100        # metres -> cm
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 5

  - platform: adc
    id: battery_voltage
    name: "Battery voltage"
    pin: GPIO0
    attenuation: 12db
    samples: 8
    update_interval: never
    accuracy_decimals: 2
    filters:
      - multiply: 2.0        # 100k/100k divider; check against a meter and scale this (see the README)
    on_value:
      then:
        - component.update: battery_percent

  - platform: template
    id: battery_percent
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement # keeps long-term history for the month chart
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      // simple Li-ion curve: 3.3 V = empty, 4.15 V = full (the XIAO charges to 4.2 V)
      float v = id(battery_voltage).state;
      float p = (v - 3.3f) / (4.15f - 3.3f) * 100.0f;
      return p < 0 ? 0 : (p > 100 ? 100 : p);

  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 15s

binary_sensor:
  - platform: gpio
    id: float_low
    name: "Float switch low"
    device_class: problem
    pin:
      number: GPIO1
      inverted: true
      mode: INPUT
      allow_other_uses: true
    filters:
      - delayed_on_off: 500ms   # ignore ripples bouncing the float

  # "DIP stay awake" helper in Home Assistant (created by ../ha/dip_package.yaml)
  - platform: homeassistant
    id: stay_awake
    entity_id: input_boolean.dip_stay_awake
    on_press:
      - deep_sleep.prevent: sleeper
      - script.execute: awake_loop
    on_release:
      - deep_sleep.allow: sleeper
      - delay: 5s              # a quick off-on tap shouldn't put it to sleep
      - if:
          condition:
            binary_sensor.is_off: stay_awake
          then:
            - deep_sleep.enter:  # same 2 min / 20 min choice as a normal reading
                id: sleeper
                sleep_duration: !lambda |-
                  return id(float_low).state ? ${low_water_sleep_ms} : ${normal_sleep_ms};
