<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Pond sensor wiring</title>
  <rect width="960" height="690" fill="#FFFFFF"/>

  <!-- rails -->
  <line x1="40" y1="50" x2="920" y2="50" stroke="#D0312D" stroke-width="4"/>
  <text x="40" y="38" fill="#D0312D" font-weight="bold">3V3 (from the holder's 3V pin)</text>
  <line x1="40" y1="650" x2="920" y2="650" stroke="#222222" stroke-width="4"/>
  <text x="40" y="676" fill="#222222" font-weight="bold">GND</text>

  <!-- battery holder -->
  <rect x="40" y="120" width="180" height="200" rx="10" fill="#F4E9D8" stroke="#8C6A2C" stroke-width="2"/>
  <text x="130" y="145" text-anchor="middle" font-weight="bold">18650 holder</text>
  <text x="130" y="163" text-anchor="middle" font-size="12" fill="#5A4A3A">SW1 set to "stay on"</text>
  <text x="208" y="205" text-anchor="end">3V +</text>
  <text x="208" y="245" text-anchor="end">3V −</text>
  <text x="208" y="285" text-anchor="end">B+ (cell +)</text>
  <path d="M220 200 H250 V50" fill="none" stroke="#D0312D" stroke-width="3"/>
  <path d="M220 240 H265 V650" fill="none" stroke="#222222" stroke-width="3"/>

  <!-- battery sense divider -->
  <path d="M220 280 H285" fill="none" stroke="#7B3FB5" stroke-width="3"/>
  <rect x="285" y="270" width="44" height="20" fill="#FFFFFF" stroke="#7B3FB5" stroke-width="2"/>
  <text x="307" y="264" text-anchor="middle" font-size="12">100k</text>
  <path d="M329 280 H345 V320 H380" fill="none" stroke="#7B3FB5" stroke-width="3"/>
  <circle cx="345" cy="280" r="4" fill="#7B3FB5"/>
  <path d="M345 280 V420" fill="none" stroke="#7B3FB5" stroke-width="3"/>
  <rect x="335" y="420" width="20" height="44" fill="#FFFFFF" stroke="#7B3FB5" stroke-width="2"/>
  <text x="300" y="447" font-size="12">100k</text>
  <path d="M345 464 V650" fill="none" stroke="#222222" stroke-width="3"/>

  <!-- SuperMini -->
  <rect x="380" y="120" width="170" height="320" rx="10" fill="#E3EEF9" stroke="#2F6FDB" stroke-width="2"/>
  <text x="465" y="148" text-anchor="middle" font-weight="bold">ESP32-C3</text>
  <text x="465" y="166" text-anchor="middle" font-weight="bold">SuperMini</text>
  <text x="392" y="205">3V3</text>
  <text x="392" y="245">GND</text>
  <text x="392" y="325">GPIO4</text>
  <text x="538" y="205" text-anchor="end">GPIO6</text>
  <text x="538" y="245" text-anchor="end">GPIO7</text>
  <text x="538" y="365" text-anchor="end">GPIO3</text>
  <path d="M380 200 H365 V50" fill="none" stroke="#D0312D" stroke-width="3"/>
  <path d="M380 240 H372 V500 H372 V650" fill="none" stroke="#222222" stroke-width="3"/>

  <!-- sensor board -->
  <rect x="690" y="120" width="190" height="180" rx="10" fill="#DCEBFB" stroke="#1F4E8C" stroke-width="2"/>
  <text x="785" y="145" text-anchor="middle" font-weight="bold">JSN-SR20-Y1 board</text>
  <text x="785" y="163" text-anchor="middle" font-size="12" fill="#1F4E8C">360k on the MODE pad</text>
  <text x="702" y="185">VCC (5V pin)</text>
  <text x="702" y="210">Trig</text>
  <text x="702" y="245">Echo</text>
  <text x="868" y="285" text-anchor="end">GND</text>
  <path d="M690 180 H660 V50" fill="none" stroke="#D0312D" stroke-width="3"/>
  <path d="M550 200 H600 V205 H690" fill="none" stroke="#2F6FDB" stroke-width="3"/>
  <path d="M550 240 H690" fill="none" stroke="#1E8A4C" stroke-width="3"/>
  <path d="M880 280 H905 V650" fill="none" stroke="#222222" stroke-width="3"/>
  <text x="620" y="196" font-size="12" fill="#2F6FDB">trig</text>
  <text x="620" y="234" font-size="12" fill="#1E8A4C">echo</text>
  <text x="785" y="320" text-anchor="middle" font-size="12" fill="#1F4E8C">two probes plug into the board</text>

  <!-- float switch + pull-up -->
  <rect x="690" y="360" width="190" height="110" rx="10" fill="#FFF1DE" stroke="#C86A12" stroke-width="2"/>
  <text x="785" y="385" text-anchor="middle" font-weight="bold">Float switch</text>
  <text x="785" y="403" text-anchor="middle" font-size="12" fill="#8A4A0E">OPEN when water is normal</text>
  <text x="702" y="425">wire 1</text>
  <text x="868" y="455" text-anchor="end">wire 2</text>
  <path d="M550 360 H610 V420 H690" fill="none" stroke="#C86A12" stroke-width="3"/>
  <path d="M690 450 H690" fill="none"/>
  <path d="M880 450 H915 V650" fill="none" stroke="#222222" stroke-width="3"/>
  <circle cx="610" cy="360" r="4" fill="#C86A12"/>
  <path d="M610 360 V338" fill="none" stroke="#C86A12" stroke-width="3"/>
  <rect x="600" y="300" width="20" height="38" fill="#FFFFFF" stroke="#C86A12" stroke-width="2"/>
  <text x="568" y="323" font-size="12">100k</text>
  <path d="M610 292 V300" fill="none" stroke="#D0312D" stroke-width="3"/>
  <text x="610" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#D0312D">to 3V3</text>
  <text font-size="12" fill="#5A606A"><tspan x="40" y="520">Float closes to GND = low water</tspan><tspan x="40" y="536">= instant wake (GPIO3).</tspan><tspan x="40" y="566">Float and temperature probe share</tspan><tspan x="40" y="582">one 4-wire cable from the box to</tspan><tspan x="40" y="598">the pipe cap: 3V3, GND, float,</tspan><tspan x="40" y="614">probe data.</tspan></text>
  

  <!-- DS18B20 water-temperature probe -->
  <text x="538" y="415" text-anchor="end">GPIO5</text>
  <rect x="690" y="520" width="190" height="96" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2"/>
  <text x="785" y="545" text-anchor="middle" font-weight="bold">DS18B20 probe</text>
  <text x="785" y="563" text-anchor="middle" font-size="12" fill="#2E7D4F">in the pipe, near the bottom</text>
  <text x="702" y="585">yellow: data</text>
  <text x="868" y="605" text-anchor="end">black: GND</text>
  <text x="702" y="605">red: 3V3</text>
  <path d="M750 520 V508" fill="none" stroke="#D0312D" stroke-width="3"/>
  <text x="750" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#D0312D">to 3V3</text>
  <path d="M880 600 H895 V650" fill="none" stroke="#222222" stroke-width="3"/>
  <path d="M550 410 H595 V580 H690" fill="none" stroke="#B8860B" stroke-width="3"/>
  <circle cx="640" cy="580" r="4" fill="#B8860B"/>
  <path d="M640 580 V548" fill="none" stroke="#B8860B" stroke-width="3"/>
  <rect x="630" y="510" width="20" height="38" fill="#FFFFFF" stroke="#B8860B" stroke-width="2"/>
  <text x="604" y="533" font-size="12">4.7k</text>
  <path d="M640 510 V502" fill="none" stroke="#D0312D" stroke-width="3"/>
  <text x="640" y="496" text-anchor="middle" font-size="12" font-weight="bold" fill="#D0312D">to 3V3</text>
</svg>
